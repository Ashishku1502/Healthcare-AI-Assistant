services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: parchi, POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: parchi }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://parchi:${DB_PASSWORD}@db:5432/parchi
      APP_SECRET: ${APP_SECRET}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
volumes: { pgdata: {} }
